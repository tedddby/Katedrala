name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          # Path handling and line endings differ on Windows; analysis output must not.
          - os: windows-latest
            node: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Git-based features (diff, history) are tested against real history.
          fetch-depth: 0

      - name: Set up pnpm
        # Uses the version pinned in package.json ("packageManager").
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: JSON Schemas are up to date
        run: pnpm schema:check

      - name: Tests
        run: pnpm test
