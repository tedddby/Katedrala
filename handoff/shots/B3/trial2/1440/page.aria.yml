      - paragraph: Controllers cannot depend on repositories. The path through OrderService is allowed; the new import skips it.
      - paragraph: src/orders/order.controller.ts
      - paragraph: 1 error, 2 rules checked
    - paragraph: Demonstration system, with one hypothetical import added. The configuration syntax is the one Katedrala's rule fixtures use today; the report layout is a preview.
  - region "Every conclusion has evidence.":
    - heading "Every conclusion has evidence." [level=2]
    - paragraph: Every relationship points to the lines of code it came from, and every score will break down into its measurements.
    - heading "Why does PaymentService score 0.58?" [level=3]
    - text: Planned for v1
    - list:
      - listitem: "6 of 15 members rest on it, directly or through other members. Reach: normalized 0.70 × weight 0.40 = 0.28"
      - listitem: "3 members call it directly: CheckoutService, OrderService and InvoiceService. Fan-in: normalized 0.50 × weight 0.20 = 0.10"
      - listitem: "Its callers sit in 3 other modules: Checkout, Orders and Billing. Cross-module spread: normalized 0.50 × weight 0.25 = 0.13"
      - listitem: "Its betweenness is 13.2: summed over pairs of other members, the share of each pair's shortest dependency paths that pass through it. Brokerage: normalized 0.50 × weight 0.15 = 0.07"
    - paragraph: Gravity 0.58
    - paragraph: Demonstration system. Each reason adds its normalized value times its weight, rounded so the four add up to the score. Gravity is a draft Katedrala heuristic, planned for v1.
    - heading "One relationship, as Katedrala records it." [level=3]
    - text: Available today
