  - region "Some members hold up more of the system than others.":
    - heading "Some members hold up more of the system than others." [level=2]
    - paragraph: Architectural Gravity will measure how much rests on each member, from the dependency graph and module boundaries.
    - text: Katedrala heuristic, planned for v1
    - radiogroup "Member to measure":
      - radio "Database 0.64" [checked]
      - radio "PaymentService 0.58"
      - radio "OrderService 0.46"
      - radio "CheckoutController 0.25"
      - radio "ApiGateway 0.00"
    - figure "Everything that rests on Database, directly or through other members. Demonstration system.":
      - figure:
        - 'img "Load drawing of the demonstration system: 13 members rest on Database; directly: OrderRepository, PaymentRepository, SessionStore, UserRepository; 2 steps away: AuthService, OrderService, PaymentService, UserService; 3 steps away: ApiGateway, CheckoutService, InvoiceService, OrderController; 4 steps away: CheckoutController."'
      - text: Everything that rests on Database, directly or through other members. Demonstration system.
    - status: "Database: gravity 0.64, 13 of 15 members rest on it."
    - paragraph: 0.64 Gravity of Database
    - list:
      - listitem: "Reach 13 of 15 rest on it : normalized 0.95 × weight 0.40 = 0.38"
      - listitem: "Fan-in 4 direct : normalized 0.58 × weight 0.20 = 0.12"
      - listitem: "Cross-module spread 4 other modules : normalized 0.57 × weight 0.25 = 0.14"
      - listitem: "Brokerage betweenness 0.0 : normalized 0.00 × weight 0.15 = 0.00"
    - text: Sum 0.64
    - paragraph: "Each term adds its normalized value times its weight, rounded so the terms add up to the score. Reach, fan-in and brokerage are log shares, ln(1 + x) / ln(1 + max), against the most a system of 16 members allows: 15 for reach and fan-in, 210 for brokerage. Spread saturates as x / (x + 3). No term depends on the largest value observed, so a score moves with what rests on the member and only slightly as the system grows."
    - paragraph: "Gravity is a Katedrala heuristic, not an established metric. Three of its four terms are established measures: reach is the visibility fan-in behind the propagation cost of MacCormack, Rusnak and Baldwin (2006), fan-in is afferent coupling (Martin 1994), and brokerage is betweenness centrality (Freeman 1977; computed with Brandes 2001). Cross-module spread is Katedrala's own. The weights are design choices and will be documented with the method in milestone 6."
  - region "Structure decays one dependency at a time.":
    - heading "Structure decays one dependency at a time." [level=2]
    - paragraph: "Architectural Entropy will score disorder: cycles, dependencies against the grain, scattered coupling and propagation."
    - text: Katedrala heuristic, planned for v1
    - figure "Modules of the demonstration system. Arcs are dependencies added by the commits; lit modules are tangled in a cycle. No module is in a cycle.":
      - 'img "Modules of the demonstration system on their load levels, Platform the foundation, after 0 of 5 commits: no dependency added; no module cycles."': Gateway Auth Checkout Orders Billing Payments Users Platform
      - text: Modules of the demonstration system. Arcs are dependencies added by the commits; lit modules are tangled in a cycle. No module is in a cycle.
    - text: 0.22 low entropy
    - radiogroup "Commits applied":
      - radio "base Clean structure" [checked]
      - radio "+1 Send order confirmations from the user repository"
      - radio "+2 Check permissions before charging"
      - radio "+3 Recalculate invoices from orders"
      - radio "+4 Show unpaid invoices on profiles"
      - radio "+5 Audit order access from auth"
    - list:
      - listitem:
        - text: "Cycles : normalized 0.00 × weight 0.30 = 0.00"
        - paragraph: No member is part of a cycle.
      - listitem:
        - text: "Against the grain : normalized 0.00 × weight 0.25 = 0.00"
        - paragraph: Cross-module dependencies all flow one way.
      - listitem:
        - text: "Scatter : normalized 0.49 × weight 0.25 = 0.12"
        - paragraph: A module's dependencies spread over 2.9 modules on average, its own included.
      - listitem:
        - text: "Propagation : normalized 0.47 × weight 0.20 = 0.10"
        - paragraph: 30% of member pairs are joined by a dependency path.
    - text: Sum 0.22
    - paragraph: Each factor adds its normalized value times its weight, rounded so the factors add up to the score.
    - paragraph: "Entropy is a Katedrala heuristic. Its factors come from established ideas: acyclic dependencies (Martin 2003), propagation cost (MacCormack, Rusnak and Baldwin 2006) and Shannon entropy (Shannon 1948). Their selection, normalization and weights are design choices, and the score has not been validated against maintenance outcomes."
  - region "Know what a change will touch before you make it.":
    - heading "Know what a change will touch before you make it." [level=2]
    - paragraph: Katedrala will trace dependency paths out from a change to estimate its structural blast radius, path by path.
    - text: Planned for v1 katedrala impact
    - combobox "katedrala impact":
      - option "AuthService"
      - option "CheckoutController"
      - option "CheckoutService"
      - option "Database"
      - option "EventBus"
      - option "InvoiceService"
      - option "OrderController"
      - option "OrderRepository"
      - option "OrderService"
      - option "PaymentRepository"
