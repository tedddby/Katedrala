    - figure:
      - 'img "Load drawing of the demonstration system: 6 members depend on PaymentService; directly: CheckoutService, InvoiceService, OrderService; 2 steps away: CheckoutController, OrderController; 3 steps away: ApiGateway."'
    - paragraph: Impact rises through everything that rests on the change. Demonstration system.
    - status: Changing PaymentService affects 6 members in 4 modules, including 3 HTTP handlers.
    - term: Members affected
    - definition: "6"
    - term: Modules
    - definition: "4"
    - term: HTTP handlers
    - definition: "3"
    - heading "Why each member is affected" [level=3]
    - list:
      - listitem: 1 CheckoutService → PaymentService
      - listitem: 1 InvoiceService → PaymentService
      - listitem: 1 OrderService → PaymentService
      - listitem: 2 CheckoutController → CheckoutService → PaymentService
      - listitem: 2 OrderController → OrderService → PaymentService
      - listitem: 3 ApiGateway → CheckoutController → CheckoutService → PaymentService
    - paragraph: PaymentService is in the Payments module. Paths are the shortest dependency chains, with ties broken by name, so every run gives the same answer.
  - region "Write down the architecture you intend.":
    - heading "Write down the architecture you intend." [level=2]
    - paragraph: Rules in katedrala.config.yaml will check every change for forbidden dependencies, layering, isolation, cycles and fan-out.
    - text: Planned for v1
    - figure "katedrala.config.yaml":
      - text: katedrala.config.yaml
      - button "Copy katedrala.config.yaml"
      - status
      - code: "groups: controllers: [\"src/**/*.controller.ts\"] repositories: [\"src/**/*.repository.ts\"] modules: payments: [\"src/payments/**\"] analytics: [\"src/analytics/**\"] rules: - id: controllers-no-database severity: error from: controllers cannot_depend_on: [repositories] - id: payments-isolation severity: error module: payments cannot_depend_on: [analytics]"
    - figure "error controllers-no-database OrderController now depends on OrderRepository. Controllers cannot depend on repositories. The path through OrderService is allowed; the new import skips it. src/orders/order.controller.ts 1 error, 2 rules checked":
      - text: hypothetical change + OrderController → OrderRepository
      - 'img "Hypothetical change to the demonstration system: OrderController reaches OrderRepository through OrderService, which is allowed; a new direct import from OrderController to OrderRepository breaks the rule controllers-no-database. Controllers cannot depend on repositories."'
      - paragraph: error controllers-no-database
