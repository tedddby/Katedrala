  - heading "Katedrala will power CodeVerse." [level=3]
  - paragraph: "CodeVerse turns a GitHub repository into a 3D city you can fly through: directories become districts, files become buildings, imports become arcs. With Katedrala underneath, the city will show the architecture as well: inferred modules, the components that carry the most load, cycles and broken rules."
  - paragraph: "CodeVerse is a separate open-source project, and Katedrala does not depend on it. Katedrala already analyzes its source: 3,766 symbols and 14,233 relationships, the same document on every run."
  - link "Open CodeVerse":
    - /url: https://codeverse.awab.tech
  - link "CodeVerse on GitHub":
