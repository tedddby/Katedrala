    - text: Everything that rests on Database, directly or through other members. Demonstration system.
  - status: "Database: gravity 0.64, 13 of 15 members rest on it."
  - paragraph: 0.64 Gravity of Database
  - list:
    - listitem: "Reach 13 of 15 rest on it : normalized 0.95 × weight 0.40 = 0.38"
    - listitem: "Fan-in 4 direct : normalized 0.58 × weight 0.20 = 0.12"
    - listitem: "Cross-module spread 4 other modules : normalized 0.57 × weight 0.25 = 0.14"
    - listitem: "Brokerage betweenness 0.0 : normalized 0.00 × weight 0.15 = 0.00"
  - text: Sum 0.64
  - paragraph: "Each term adds its normalized value times its weight, rounded so the terms add up to the score. Reach, fan-in and brokerage are log shares, ln(1 + x) / ln(1 + max), against the most a system of 16 members allows: 15 for reach and fan-in, 210 for brokerage. Spread saturates as x / (x + 3). No term depends on the largest value observed, so a score moves with what rests on the member and only slightly as the system grows."
  - paragraph: "Gravity is a Katedrala heuristic, not an established metric. Three of its four terms are established measures: reach is the visibility fan-in behind the propagation cost of MacCormack, Rusnak and Baldwin (2006), fan-in is afferent coupling (Martin 1994), and brokerage is betweenness centrality (Freeman 1977; computed with Brandes 2001). Cross-module spread is Katedrala's own. The weights are design choices and will be documented with the method in milestone 6."
