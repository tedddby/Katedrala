- region "One command per question.":
  - heading "One command per question." [level=2]
  - paragraph: From v1, each question below will be one command away, in your terminal or in CI.
  - text: Planned for v1
  - tablist "Commands":
    - tab "analyze" [selected]
    - tab "health"
    - tab "impact"
    - tab "validate"
    - tab "diff"
  - paragraph: What is in this repository?
  - tabpanel "analyze":
    - text: "terminal real counts: CodeVerse at 6b942bc"
    - code: $ katedrala analyze . tedddby/CodeVerse at 6b942bc files 644 analyzed 594 directories 84 symbols 3,766 relationships 14,233 externals 59 npm packages 39 Node.js built-ins 8 environment variables 12 unresolved imports 0
  - paragraph: The command line is planned for v1, and this output previews its format. The analyze counts are real. The other values are computed from the demonstration system, with one hypothetical import added for validate, from OrderController to OrderRepository.
  - heading "Or call the engine from code." [level=3]
  - text: Available today
  - figure "analyze.mjs":
    - text: analyze.mjs
    - button "Copy analyze.mjs"
    - status
    - region "analyze.mjs":
      - code: "import { analyzeStructure } from \"@katedrala/engine\"; const { document } = await analyzeStructure({ root: \"../CodeVerse\" }); console.log(document.repository.stats); // CodeVerse at 6b942bc: 644 files, 3,766 symbols, 14,233 edges"
  - paragraph:
    - text: The engine runs today as a TypeScript library,
    - link "from a clone of the repository":
      - /url: https://github.com/tedddby/Katedrala#get-started
    - text: . npm packages are planned for v1.
  - term: Deterministic Available today
  - definition: The same files, configuration and Katedrala version produce the same document, byte for byte. Two analyses of CodeVerse came out identical.
  - term: Versioned schemas Available today
  - definition:
    - text: The document format is specified as JSON Schema, generated from its TypeScript types and versioned in the repository. Today,
    - code: analyzeStructure
    - text: returns the document's structural sections.
  - term: Local Available today
  - definition: Analysis runs on your machine. No network calls, no language model, nothing uploaded.
  - term: Made for CI Planned for v1
  - definition: Reports will be human-readable by default, with JSON or YAML for tools and an exit code that can fail a pull request.
