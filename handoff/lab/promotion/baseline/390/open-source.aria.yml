- region "Read every line of it.":
  - heading "Read every line of it." [level=2]
  - paragraph: Katedrala is MIT licensed. Its engine, document contract, design decisions and roadmap all live in the repository.
  - term: MIT licensed
  - definition: Use it, change it and build on it, in open-source and commercial work alike.
  - term: A formal contract
  - definition: The architecture document is specified in the repository, as TypeScript types and the JSON Schema generated from them.
  - term: Recorded decisions
  - definition: Architecture decision records explain how the engine is built, and why.
  - term: Built to extend
  - definition: Languages plug in through a typed adapter contract. TypeScript and JavaScript come first.
  - link "View on GitHub":
    - /url: https://github.com/tedddby/Katedrala
  - link "Contribute":
    - /url: https://github.com/tedddby/Katedrala/blob/main/CONTRIBUTING.md
  - heading "The road to v1." [level=3]
